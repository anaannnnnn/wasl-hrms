name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: for f in $(find src -name '*.js') ../web/*.js; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Integration tests (tenant isolation, encryption, payroll end to end)
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration.log || {
            # surface failures as annotations so they are readable without downloading logs
            awk '/^not ok|^# Subtest|^    not ok/{p=1} p{print} /^  \.\.\.$|^    \.\.\.$/{if(p){print "@@END"};p=0}' integration.log > fails.txt || true
            node -e "const t=require('fs').readFileSync('fails.txt','utf8').split('@@END').filter(x=>/not ok/.test(x)).slice(0,10);for(const b of t)console.log('::error title=integration::'+b.trim().slice(0,3500).replace(/%/g,'%25').replace(/\r/g,'').replace(/\n/g,'%0A'))"
            exit 1
          }
        env:
          MONGO_URI_TEST: mongodb://localhost:27017/wasl_ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
