# Local run:   docker compose up -d --build   then   docker compose exec api npm --prefix server run seed
# Linode:      same file on a Dedicated/Shared CPU Ubuntu LTS instance; set DOMAIN + secrets in .env
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok}"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis: # reserved for BullMQ jobs (payroll, OCR, document alerts) in the next sprint
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis_data:/data]

  api:
    build: { context: ., dockerfile: server/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/wasl_hrms?replicaSet=rs0
      PORT: 4000
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["4000:4000"]

  nginx: # optional TLS front door for Linode; start with: docker compose --profile proxy up -d
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/letsencrypt:ro

volumes:
  mongo_data:
  redis_data:
