# Replace hr.example.ae with your domain. Get certificates on the Linode host with:
#   sudo certbot certonly --standalone -d hr.example.ae
# then copy /etc/letsencrypt into ./nginx/certs (or mount it directly).
server {
  listen 80;
  server_name hr.example.ae;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name hr.example.ae;

  ssl_certificate     /etc/letsencrypt/live/hr.example.ae/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hr.example.ae/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  client_max_body_size 10m;

  location / {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
